name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }}, CMP ${{ matrix.compose }})
    strategy:
      fail-fast: false
      matrix:
        # PRD §10: the last two stable Compose Multiplatform releases.
        # `-PcomposeVersion` overrides the catalog value in buildSrc.
        compose: ["1.12.2", "1.11.1"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" || true

      - name: Build library & run desktop tests
        run: >-
          ./gradlew build :sample-app:compileKotlinDesktop
          -x :sample-app:build -x :android-app:build -x :desktop-app:build
          -PcomposeVersion=${{ matrix.compose }} --stacktrace

      - name: Run desktop tests
        run: ./gradlew desktopTest -PcomposeVersion=${{ matrix.compose }} --stacktrace

  android-assemble:
    name: Android assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" || true

      - name: Assemble debug APK
        run: ./gradlew :android-app:assembleDebug --stacktrace

  benchmarks:
    name: Desktop benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" || true

      # PRD §12/§17: offscreen, software-rendered microbenchmarks with a
      # hand-written baseline. Fails only beyond a generous 3x tolerance.
      - name: Run microbenchmarks
        run: ./gradlew :benchmarks:benchmark --stacktrace

  ios-sim:
    name: iOS app build (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Type-checks the iosMain UIKit actuals of the Native Interop Bridge
      # (docs/NATIVE_BRIDGE.md). Klib compilation works on any host; linking a
      # real app/framework is what needs Xcode.
      - name: Compile iOS simulator target
        run: ./gradlew compileKotlinIosSimulatorArm64 --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # Builds the real app shell, so the Gradle embedAndSign phase, the
      # framework search path, the Swift wrapper, and the link all get exercised.
      # Signing is unnecessary for the simulator.
      - name: Build sample app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/xcode \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
