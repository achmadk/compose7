name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux: desktop target + JVM tests. macOS: adds iOS targets.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" || true

      - name: Build library & run desktop tests
        run: ./gradlew build -x :sample-app:build -x :android-app:build -x :desktop-app:build --stacktrace

      - name: Run desktop tests
        run: ./gradlew desktopTest --stacktrace

  android-assemble:
    name: Android assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" || true

      - name: Assemble debug APK
        run: ./gradlew :android-app:assembleDebug --stacktrace

  ios-sim:
    name: iOS compile check (bridge klibs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Type-checks the iosMain UIKit actuals of the Native Interop Bridge
      # (docs/NATIVE_BRIDGE.md). Klib compilation works on any host; linking a
      # real app/framework is what needs Xcode.
      - name: Compile iOS simulator target
        run: ./gradlew compileKotlinIosSimulatorArm64 --stacktrace
