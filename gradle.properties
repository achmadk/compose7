#Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

#Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Publishing (read by com.vanniktech.maven.publish)
# License and developer entries are declared in the buildSrc convention plugin;
# declare them only there - the plugin also maps POM_LICENCE_*/POM_DEVELOPER_*
# from this file, which would duplicate the POM elements.
GROUP=io.github.compose7
VERSION_NAME=0.1.0-alpha01
POM_URL=https://github.com/compose7/compose7
POM_SCM_URL=https://github.com/compose7/compose7
POM_SCM_CONNECTION=scm:git:git://github.com/compose7/compose7.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/compose7/compose7.git
